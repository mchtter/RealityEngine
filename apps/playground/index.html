<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kavra 3D City Engine — Playground</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        user-select: none;
      }
      body, html {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #090d16;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        color: #f1f5f9;
      }
      #canvas-container {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }
      .toolbar {
        position: absolute;
        top: 16px;
        left: 50%;
        transform: translateX(-50%);
        display: flex;
        align-items: center;
        gap: 12px;
        background: rgba(15, 23, 42, 0.82);
        backdrop-filter: blur(16px);
        padding: 8px 16px;
        border-radius: 9999px;
        border: 1px solid rgba(255, 255, 255, 0.12);
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
        z-index: 100;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 8px;
        font-weight: 700;
        font-size: 14px;
        letter-spacing: 0.05em;
        padding-right: 12px;
        border-right: 1px solid rgba(255, 255, 255, 0.15);
        color: #38bdf8;
      }
      .toolbar select, .toolbar button {
        background: rgba(255, 255, 255, 0.08);
        border: 1px solid rgba(255, 255, 255, 0.15);
        color: #fff;
        padding: 6px 12px;
        border-radius: 9999px;
        font-size: 13px;
        font-weight: 500;
        cursor: pointer;
        outline: none;
        transition: all 0.2s ease;
      }
      .toolbar select:hover, .toolbar button:hover {
        background: rgba(255, 255, 255, 0.16);
        border-color: rgba(255, 255, 255, 0.3);
      }
      .toolbar button.primary {
        background: #0284c7;
        border-color: #38bdf8;
      }
      .toolbar button.primary:hover {
        background: #0369a1;
      }
      #status {
        font-size: 12px;
        color: #94a3b8;
      }
      .spinner {
        width: 14px;
        height: 14px;
        border: 2px solid rgba(255, 255, 255, 0.2);
        border-top-color: #38bdf8;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
        display: inline-block;
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body>
    <div id="canvas-container"></div>
    <div class="toolbar">
      <div class="brand">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <polygon points="12 2 2 7 12 12 22 7 12 2"></polygon>
          <polyline points="2 17 12 22 22 17"></polyline>
          <polyline points="2 12 12 17 22 12"></polyline>
        </svg>
        KAVRA 3D
      </div>
      <select id="city-select">
        <option value="kadikoy">Downtown Waterfront</option>
        <option value="manhattan">Manhattan Flatiron (NYC)</option>
        <option value="eiffel">Eiffel Tower Area (Paris)</option>
        <option value="berlin">Brandenburg Gate (Berlin)</option>
      </select>
      <button id="load-btn" class="primary">Load OSM 3D</button>
      <span id="status">Ready</span>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
