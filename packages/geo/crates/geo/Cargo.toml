[package]
name = "reality-geo"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"
description = "Reality Engine geometry kernels (Node addon and WebAssembly)"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
earcutr = "0.5.0"
i_overlay = "9.1.0"
rustc-hash = "2.1.3"
wasm-bindgen = { version = "0.2.129", optional = true }

[dev-dependencies]
serde_json = "1.0.154"

[features]
wasm-bindgen = ["dep:wasm-bindgen"]
